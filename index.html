<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>MEDPATH</title>
<meta name="description" content="MEDPATH — field protocol and dosing reference">
<meta name="theme-color" content="#f4e9e6">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="assets/icons/icon-32.png">
<link rel="apple-touch-icon" href="assets/icons/icon-180.png">
<link rel="stylesheet" href="css/style.css">
</head>
<body>

<header class="app-header">
  <div class="header-status" id="connStatus" title="Works offline once loaded">●</div>
  <div class="brand" id="brandHome">
    <img src="assets/logo.png" alt="MEDPATH" class="brand-logo">
    <span class="brand-name">MEDPATH</span>
  </div>
</header>

<main id="app" class="app-main"></main>

<button id="arrestFab" class="arrest-fab hidden" aria-label="Return to arrest in progress">⏱</button>

<template id="tpl-home">
  <section class="screen screen-home">
    <button class="big-cta" id="newPatientBtn">
      <span class="cta-label">New Patient</span>
    </button>

    <div class="tile-section">
      <div class="tile-grid">
        <button class="tile" id="browseAllBtn">
          <span class="tile-icon tint-indigo">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><line x1="8" y1="6" x2="20" y2="6"/><line x1="8" y1="12" x2="20" y2="12"/><line x1="8" y1="18" x2="20" y2="18"/><circle cx="4" cy="6" r="1"/><circle cx="4" cy="12" r="1"/><circle cx="4" cy="18" r="1"/></svg>
          </span>
          <span class="tile-label">Browse Protocols</span>
        </button>
        <button class="tile" id="runArrestBtn">
          <span class="tile-icon tint-coral">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="2,12 7,12 9,6 13,18 16,12 22,12"/></svg>
          </span>
          <span class="tile-label">Run An Arrest</span>
        </button>
        <button class="tile" id="toolSizingBtn">
          <span class="tile-icon tint-gold">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="8" width="18" height="8" rx="1.5"/><line x1="7" y1="8" x2="7" y2="11"/><line x1="11" y1="8" x2="11" y2="11"/><line x1="15" y1="8" x2="15" y2="11"/><line x1="19" y1="8" x2="19" y2="11"/></svg>
          </span>
          <span class="tile-label">Tool Sizing</span>
        </button>
      </div>
    </div>

    <div class="tile-section">
      <p class="tile-section-label">Pharmacology</p>
      <div class="tile-grid tile-grid-2">
        <button class="tile" id="drugRefBtn">
          <span class="tile-icon tint-moss">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="2" y="9" width="20" height="6" rx="3" transform="rotate(45 12 12)"/><line x1="12" y1="6" x2="12" y2="18" transform="rotate(45 12 12)"/></svg>
          </span>
          <span class="tile-label">Drug Reference</span>
        </button>
        <button class="tile" id="drugQuizBtn">
          <span class="tile-icon tint-sakura">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="5" y="4" width="14" height="17" rx="2"/><polyline points="8,13 11,16 16,10"/></svg>
          </span>
          <span class="tile-label">Drug Identity Test</span>
        </button>
      </div>
    </div>

    <p class="meta-note" id="metaNote"></p>
  </section>
</template>

<template id="tpl-demographic">
  <section class="screen">
    <h2 class="step-title"><span class="step-num">1</span> Adult or Pediatric?</h2>
    <div class="choice-row">
      <button class="choice-btn" data-demo="adult">
        <span>Adult</span>
      </button>
      <button class="choice-btn" data-demo="pediatric">
        <span>Pediatric</span>
        <span class="choice-hint">&lt; 16 yrs</span>
      </button>
    </div>
  </section>
</template>

<template id="tpl-cc-list">
  <section class="screen">
    <h2 class="step-title"><span class="step-num">2</span> Chief Complaint</h2>
    <input type="text" id="ccSearch" class="text-input" placeholder="Search complaints…" autocomplete="off">
    <div id="ccGrid" class="cc-groups"></div>
  </section>
</template>

<template id="tpl-branch-select">
  <section class="screen">
    <h2 class="step-title"><span class="step-num">3</span> Select Matching Presentation</h2>
    <p class="protocol-context"></p>
    <div id="branchList" class="branch-list"></div>
  </section>
</template>

<template id="tpl-protocol-view">
  <section class="screen screen-protocol">
    <div class="protocol-head">
      <h2 id="protoTitle"></h2>
      <p id="protoBranchLabel" class="branch-label"></p>
    </div>
    <div id="vitalsSummarySticky" class="vitals-summary compact"></div>
    <ol id="stepsList" class="steps-list"></ol>
    <button class="ghost-btn" id="showRefBtn">Show history / signs / differential / pearls</button>
    <div id="refPanel" class="ref-panel hidden"></div>
  </section>
</template>

<template id="tpl-drug-detail">
  <div class="drug-card"></div>
</template>

<template id="tpl-tool-sizing">
  <section class="screen screen-toolsizing">
    <h2 class="step-title">Tool Sizing</h2>
    <p class="protocol-context">Enter a patient weight to see sizing across airway, IO access, and defibrillation/cardioversion energy — grouped by category, updated live.</p>

    <div class="sizing-weight-card">
      <span class="inline-vital-label">Patient Weight</span>
      <div class="weight-toggle-row">
        <input type="number" step="0.1" min="0" id="tsWeightInput" class="text-input" placeholder="e.g. 180">
        <div class="unit-toggle" id="tsUnitToggle">
          <button type="button" class="unit-btn active" data-unit="lb">lb</button>
          <button type="button" class="unit-btn" data-unit="kg">kg</button>
        </div>
      </div>
    </div>

    <div id="tsCategories" class="ts-categories"></div>
  </section>
</template>

<template id="tpl-drug-quiz">
  <section class="screen screen-quiz">
    <div id="quizPre" class="quiz-pre">
      <h2 class="step-title">Drug Identity Test</h2>
      <p class="quiz-intro">150 questions generated directly from MEDPATH's drug reference — drug-to-classification, classification-to-drug, clinical scenario, and straightforward recall (routes, dosing, certification level, onset). Every answer is pulled live from the same data as the drug reference, so it's always faithful to the source.</p>
      <button class="big-cta" id="startQuizBtn"><span class="cta-label">Start Test</span></button>
    </div>

    <div id="quizLive" class="quiz-live hidden">
      <div class="quiz-progress">
        <p id="quizProgressLabel" class="quiz-progress-label"></p>
        <p id="quizScoreLabel" class="quiz-score-label"></p>
      </div>
      <div class="quiz-progress-bar"><div id="quizProgressFill" class="quiz-progress-fill"></div></div>
      <p id="quizCategoryTag" class="quiz-category-tag"></p>
      <p id="quizPrompt" class="quiz-prompt"></p>
      <div id="quizOptions" class="quiz-options"></div>
      <div id="quizFeedback" class="quiz-feedback hidden"></div>
      <button type="button" class="big-cta small-cta hidden" id="quizNextBtn"><span class="cta-label">Next Question</span></button>
      <button type="button" class="ghost-btn" id="quizQuitBtn">End Test Early</button>
    </div>

    <div id="quizSummary" class="quiz-summary hidden">
      <h2 class="step-title">Test Complete</h2>
      <div id="quizSummaryBody"></div>
      <button type="button" class="big-cta small-cta" id="quizRetakeBtn"><span class="cta-label">Retake Test</span></button>
      <button type="button" class="ghost-btn" id="quizHomeBtn">Back to Home</button>
    </div>
  </section>
</template>

<template id="tpl-arrest">
  <section class="screen screen-arrest">
    <div id="arrestPre" class="arrest-pre">
      <h2 class="step-title">Run An Arrest</h2>
      <button class="big-cta" id="startOpBtn"><span class="cta-label">Start Operation</span></button>
    </div>

    <div id="arrestLive" class="arrest-live hidden">
      <div class="arrest-clock">
        <div class="arrest-clock-main">
          <p class="arrest-started" id="arrestStartedLabel"></p>
          <div class="arrest-elapsed" id="arrestElapsed">00:00:00</div>
        </div>
        <div class="arrest-quickref">
          <p class="arrest-quickref-line" id="arrestEpiDue"></p>
          <p class="arrest-quickref-line" id="arrestRhythmDue"></p>
          <p class="arrest-quickref-line" id="arrestGlucoseDue"></p>
        </div>
      </div>

      <div id="arrestAlertBanner" class="arrest-alert hidden"></div>

      <div class="arrest-subtimers">
        <div class="subtimer-row">
          <div class="subtimer-info">
            <p class="subtimer-label">CPR</p>
            <p class="subtimer-time" id="cprTime">00:00</p>
            <p class="subtimer-count" id="cprCount">Cycles: 0</p>
          </div>
          <button type="button" class="subtimer-btn" id="cprToggleBtn" aria-label="Start/stop CPR timer">▶</button>
        </div>
        <div class="subtimer-row">
          <div class="subtimer-info">
            <p class="subtimer-label">Epinephrine</p>
            <p class="subtimer-time" id="epiTime">00:00</p>
            <p class="subtimer-count" id="epiCount">Doses: 0 / max 4</p>
          </div>
          <button type="button" class="subtimer-btn" id="epiLogBtn" aria-label="Log epinephrine dose">+</button>
        </div>
      </div>

      <p class="record-label">Record Event</p>
      <div class="arrest-event-grid">
        <button type="button" class="event-btn" data-evt="rhythm">Rhythm</button>
        <button type="button" class="event-btn" data-evt="shock">Shock</button>
        <button type="button" class="event-btn" data-evt="meds">Meds</button>
        <button type="button" class="event-btn" data-evt="airway">Airway</button>
        <button type="button" class="event-btn" data-evt="ivio">IV/IO</button>
        <button type="button" class="event-btn" data-evt="glucose">Glucose</button>
        <button type="button" class="event-btn" data-evt="other">Other</button>
      </div>

      <button type="button" class="end-op-btn" id="endOpBtn">End Operation</button>

      <div class="arrest-log">
        <p class="record-label">Event Log</p>
        <ol id="arrestLogList" class="arrest-log-list"></ol>
      </div>

      <div class="arrest-sizing">
        <button type="button" class="ghost-btn" id="sizingToggleBtn">Equipment sizing (by weight)</button>
        <div id="sizingPanel" class="sizing-panel hidden">
          <div class="inline-vital inline-weight">
            <span class="inline-vital-label">Weight</span>
            <div class="weight-toggle-row">
              <input type="number" step="0.1" min="0" id="sizingWeightInput" class="text-input" placeholder="e.g. 180">
              <div class="unit-toggle" id="sizingUnitToggle">
                <button type="button" class="unit-btn active" data-unit="lb">lb</button>
                <button type="button" class="unit-btn" data-unit="kg">kg</button>
              </div>
            </div>
          </div>
          <div id="sizingResults" class="sizing-results"></div>
        </div>
      </div>

      <div class="arrest-protocol-links">
        <p class="record-label">Arrest Protocols — Quick Reference</p>
        <div id="arrestProtocolLinksLive" class="arrest-protocol-link-list"></div>
      </div>

      <div class="arrest-medcontrol">
        <p class="record-label">Med-Control Report</p>
        <div id="medControlReport" class="run-report-box"></div>
        <button type="button" class="ghost-btn" id="copyMedControlBtn">Copy Report</button>
      </div>
    </div>

    <div id="arrestSummary" class="arrest-summary hidden">
      <h2 class="step-title">Operation Summary</h2>
      <div id="arrestSummaryBody"></div>
      <button type="button" class="big-cta small-cta" id="downloadLogBtn"><span class="cta-label">Download Run Log (.txt)</span></button>
      <button type="button" class="ghost-btn" id="newOpBtn">Start New Operation</button>
    </div>
  </section>
</template>

<script src="js/app.js"></script>
</body>
</html>
