<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>MEDPATH</title>
<meta name="description" content="MEDPATH — field protocol and dosing reference">
<meta name="theme-color" content="#f4e9e6">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="assets/icons/icon-32.png">
<link rel="apple-touch-icon" href="assets/icons/icon-180.png">
<link rel="stylesheet" href="css/style.css">
</head>
<body>

<header class="app-header">
  <div class="header-status" id="connStatus" title="Works offline once loaded">●</div>
  <div class="brand" id="brandHome">
    <img src="assets/logo.png" alt="MEDPATH" class="brand-logo">
    <span class="brand-name">MEDPATH</span>
  </div>
</header>

<main id="app" class="app-main"></main>

<div id="disclaimerBar" class="disclaimer-bar">
  Reference tool only — verify against the official protocol book. Not a substitute for training, judgment, or medical direction.
</div>

<template id="tpl-home">
  <section class="screen screen-home">
    <button class="big-cta" id="newPatientBtn">
      <span class="cta-label">New Patient</span>
    </button>
    <div class="home-links">
      <button class="ghost-btn" id="browseAllBtn">Browse all protocols</button>
      <button class="ghost-btn" id="drugRefBtn">Drug reference</button>
      <button class="ghost-btn arrest-link" id="runArrestBtn">Run An Arrest</button>
    </div>
    <p class="meta-note" id="metaNote"></p>
  </section>
</template>

<template id="tpl-demographic">
  <section class="screen">
    <h2 class="step-title"><span class="step-num">1</span> Adult or Pediatric?</h2>
    <div class="choice-row">
      <button class="choice-btn" data-demo="adult">
        <span>Adult</span>
      </button>
      <button class="choice-btn" data-demo="pediatric">
        <span>Pediatric</span>
        <span class="choice-hint">&lt; 16 yrs</span>
      </button>
    </div>
  </section>
</template>

<template id="tpl-cc-list">
  <section class="screen">
    <h2 class="step-title"><span class="step-num">2</span> Chief Complaint</h2>
    <input type="text" id="ccSearch" class="text-input" placeholder="Search complaints…" autocomplete="off">
    <div id="ccGrid" class="cc-groups"></div>
  </section>
</template>

<template id="tpl-vitals">
  <section class="screen">
    <h2 class="step-title"><span class="step-num">3</span> Vitals &amp; Weight</h2>
    <form id="vitalsForm" class="vitals-form">

      <div class="vfield">
        <label class="vfield-label">Weight (lb)</label>
        <div class="weight-row">
          <input type="number" step="0.1" min="0" id="weightLbInput" class="text-input" required placeholder="e.g. 180">
          <span class="kg-readout" id="kgReadout">— kg</span>
        </div>
        <input type="hidden" name="weight" id="weightKgHidden">
      </div>

      <div class="vfield">
        <label class="vfield-label">Heart Rate (bpm)</label>
        <input type="number" name="hr" class="text-input" placeholder="e.g. 88">
      </div>

      <div class="vfield">
        <label class="vfield-label">Blood Pressure</label>
        <div class="bp-box">
          <input type="number" name="sbp" class="bp-input" placeholder="120" aria-label="Systolic">
          <span class="bp-slash">/</span>
          <input type="number" name="dbp" class="bp-input" placeholder="80" aria-label="Diastolic">
        </div>
      </div>

      <div class="vfield">
        <label class="vfield-label">Respiratory Rate</label>
        <input type="number" name="rr" class="text-input" placeholder="e.g. 16">
      </div>

      <div class="vfield">
        <label class="vfield-label">Oxygen Saturation (SpO2 %)</label>
        <input type="number" name="spo2" class="text-input" placeholder="e.g. 97">
      </div>

      <div class="vfield">
        <label class="vfield-label">Temperature (°F)</label>
        <input type="number" step="0.1" name="temp" class="text-input" placeholder="e.g. 98.6">
      </div>

      <div class="vfield">
        <label class="vfield-label">Blood Glucose</label>
        <input type="number" name="glucose" class="text-input" placeholder="e.g. 110">
      </div>

      <div class="vfield">
        <label class="vfield-label">GCS</label>
        <input type="hidden" name="gcs" id="gcsHidden">
        <button type="button" class="gcs-box" id="gcsBox">
          <span id="gcsBoxText">Tap to score</span>
        </button>
        <div class="gcs-panel hidden" id="gcsPanel">
          <div class="gcs-group" data-cat="e">
            <p class="gcs-group-title">Eye Opening</p>
            <div class="gcs-options" id="gcsEyeOpts"></div>
          </div>
          <div class="gcs-group" data-cat="v">
            <p class="gcs-group-title">Verbal Response</p>
            <div class="gcs-options" id="gcsVerbalOpts"></div>
          </div>
          <div class="gcs-group" data-cat="m">
            <p class="gcs-group-title">Motor Response</p>
            <div class="gcs-options" id="gcsMotorOpts"></div>
          </div>
          <button type="button" class="ghost-btn" id="gcsCloseBtn">Close</button>
        </div>
      </div>

      <button type="submit" class="big-cta small-cta">
        <span class="cta-label">Show Protocol</span>
      </button>
    </form>
  </section>
</template>

<template id="tpl-branch-select">
  <section class="screen">
    <h2 class="step-title"><span class="step-num">4</span> Select Matching Presentation</h2>
    <p class="protocol-context"></p>
    <div id="vitalsSummary" class="vitals-summary"></div>
    <div id="branchList" class="branch-list"></div>
  </section>
</template>

<template id="tpl-protocol-view">
  <section class="screen screen-protocol">
    <div class="protocol-head">
      <h2 id="protoTitle"></h2>
      <p id="protoBranchLabel" class="branch-label"></p>
    </div>
    <div id="vitalsSummarySticky" class="vitals-summary compact"></div>
    <ol id="stepsList" class="steps-list"></ol>
    <button class="ghost-btn" id="showRefBtn">Show history / signs / differential / pearls</button>
    <div id="refPanel" class="ref-panel hidden"></div>
  </section>
</template>

<template id="tpl-drug-detail">
  <div class="drug-card"></div>
</template>

<template id="tpl-arrest">
  <section class="screen screen-arrest">
    <div id="arrestPre" class="arrest-pre">
      <h2 class="step-title">Run An Arrest</h2>
      <p class="meta-note">Timestamped compression / rhythm / drug timer for a working arrest. Starts a live clock, prompts you (vibration + on-screen alert) when the next thing is due per protocol timing, and saves a timestamped log you can export when the call is over.</p>
      <button class="big-cta" id="startOpBtn"><span class="cta-label">Start Operation</span></button>
    </div>

    <div id="arrestLive" class="arrest-live hidden">
      <div class="arrest-clock">
        <p class="arrest-started" id="arrestStartedLabel"></p>
