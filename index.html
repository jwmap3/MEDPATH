<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>MEDPATH</title>
<meta name="description" content="MEDPATH — field protocol and dosing reference">
<meta name="theme-color" content="#f4e9e6">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="assets/icons/icon-32.png">
<link rel="apple-touch-icon" href="assets/icons/icon-180.png">
<link rel="stylesheet" href="css/style.css">
</head>
<body>

<header class="app-header">
  <div class="header-status" id="connStatus" title="Works offline once loaded">●</div>
  <div class="brand" id="brandHome">
    <img src="assets/logo.png" alt="MEDPATH" class="brand-logo">
    <span class="brand-name">MEDPATH</span>
  </div>
</header>

<main id="app" class="app-main"></main>

<button id="arrestFab" class="arrest-fab hidden" aria-label="Return to arrest in progress">⏱</button>

<template id="tpl-home">
  <section class="screen screen-home">
    <button class="big-cta" id="newPatientBtn">
      <span class="cta-label">New Patient</span>
    </button>
    <div class="home-links">
      <button class="ghost-btn" id="browseAllBtn">Browse all protocols</button>
      <button class="ghost-btn" id="drugRefBtn">Drug reference</button>
      <button class="ghost-btn arrest-link" id="runArrestBtn">Run An Arrest</button>
    </div>
    <p class="meta-note" id="metaNote"></p>
  </section>
</template>

<template id="tpl-demographic">
  <section class="screen">
    <h2 class="step-title"><span class="step-num">1</span> Adult or Pediatric?</h2>
    <div class="choice-row">
      <button class="choice-btn" data-demo="adult">
        <span>Adult</span>
      </button>
      <button class="choice-btn" data-demo="pediatric">
        <span>Pediatric</span>
        <span class="choice-hint">&lt; 16 yrs</span>
      </button>
    </div>
  </section>
</template>

<template id="tpl-cc-list">
  <section class="screen">
    <h2 class="step-title"><span class="step-num">2</span> Chief Complaint</h2>
    <input type="text" id="ccSearch" class="text-input" placeholder="Search complaints…" autocomplete="off">
    <div id="ccGrid" class="cc-groups"></div>
  </section>
</template>

<template id="tpl-branch-select">
  <section class="screen">
    <h2 class="step-title"><span class="step-num">3</span> Select Matching Presentation</h2>
    <p class="protocol-context"></p>
    <div id="branchList" class="branch-list"></div>
  </section>
</template>

<template id="tpl-protocol-view">
  <section class="screen screen-protocol">
    <div class="protocol-head">
      <h2 id="protoTitle"></h2>
      <p id="protoBranchLabel" class="branch-label"></p>
    </div>
    <div id="vitalsSummarySticky" class="vitals-summary compact"></div>
    <ol id="stepsList" class="steps-list"></ol>
    <button class="ghost-btn" id="showRefBtn">Show history / signs / differential / pearls</button>
    <div id="refPanel" class="ref-panel hidden"></div>
  </section>
</template>

<template id="tpl-drug-detail">
  <div class="drug-card"></div>
</template>

<template id="tpl-arrest">
  <section class="screen screen-arrest">
    <div id="arrestPre" class="arrest-pre">
      <h2 class="step-title">Run An Arrest</h2>
      <button class="big-cta" id="startOpBtn"><span class="cta-label">Start Operation</span></button>
    </div>

    <div id="arrestLive" class="arrest-live hidden">
      <div class="arrest-clock">
        <div class="arrest-clock-main">
          <p class="arrest-started" id="arrestStartedLabel"></p>
          <div class="arrest-elapsed" id="arrestElapsed">00:00:00</div>
        </div>
        <div class="arrest-quickref">
          <p class="arrest-quickref-line" id="arrestEpiDue"></p>
          <p class="arrest-quickref-line" id="arrestRhythmDue"></p>
        </div>
      </div>

      <div id="arrestAlertBanner" class="arrest-alert hidden"></div>

      <div class="arrest-subtimers">
        <div class="subtimer-row">
          <div class="subtimer-info">
            <p class="subtimer-label">CPR</p>
            <p class="subtimer-time" id="cprTime">00:00</p>
            <p class="subtimer-count" id="cprCount">Cycles: 0</p>
          </div>
          <button type="button" class="subtimer-btn" id="cprToggleBtn" aria-label="Start/stop CPR timer">▶</button>
        </div>
        <div class="subtimer-row">
          <div class="subtimer-info">
            <p class="subtimer-label">Epinephrine</p>
            <p class="subtimer-time" id="epiTime">00:00</p>
            <p class="subtimer-count" id="epiCount">Doses: 0 / max 4</p>
          </div>
          <button type="button" class="subtimer-btn" id="epiLogBtn" aria-label="Log epinephrine dose">+</button>
        </div>
      </div>

      <p class="record-label">Record Event</p>
      <div class="arrest-event-grid">
        <button type="button" class="event-btn" data-evt="rhythm">Rhythm</button>
        <button type="button" class="event-btn" data-evt="shock">Shock</button>
        <button type="button" class="event-btn" data-evt="meds">Meds</button>
        <button type="button" class="event-btn" data-evt="airway">Airway</button>
        <button type="button" class="event-btn" data-evt="ivio">IV/IO</button>
        <button type="button" class="event-btn" data-evt="other">Other</button>
      </div>

      <button type="button" class="end-op-btn" id="endOpBtn">End Operation</button>

      <div class="arrest-log">
        <p class="record-label">Event Log</p>
        <ol id="arrestLogList" class="arrest-log-list"></ol>
      </div>

      <div class="arrest-sizing">
        <button type="button" class="ghost-btn" id="sizingToggleBtn">Equipment sizing (by weight)</button>
        <div id="sizingPanel" class="sizing-panel hidden">
          <div class="inline-vital inline-weight">
            <span class="inline-vital-label">Weight</span>
            <div class="weight-toggle-row">
              <input type="number" step="0.1" min="0" id="sizingWeightInput" class="text-input" placeholder="e.g. 180">
              <div class="unit-toggle" id="sizingUnitToggle">
                <button type="button" class="unit-btn active" data-unit="lb">lb</button>
                <button type="button" class="unit-btn" data-unit="kg">kg</button>
              </div>
            </div>
          </div>
          <div id="sizingResults" class="sizing-results"></div>
        </div>
      </div>

      <div class="arrest-protocol-links">
        <p class="record-label">Arrest Protocols — Quick Reference</p>
        <div id="arrestProtocolLinksLive" class="arrest-protocol-link-list"></div>
      </div>
    </div>

    <div id="arrestSummary" class="arrest-summary hidden">
      <h2 class="step-title">Operation Summary</h2>
      <div id="arrestSummaryBody"></div>
      <button type="button" class="big-cta small-cta" id="downloadLogBtn"><span class="cta-label">Download Run Log (.txt)</span></button>
      <button type="button" class="ghost-btn" id="newOpBtn">Start New Operation</button>
    </div>
  </section>
</template>

<script src="js/app.js"></script>
</body>
</html>
